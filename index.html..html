*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55;padding-inline:16px}
h1,h2,h3,.disp{font-family:'Noto Serif KR',serif;text-wrap:balance}
.wrap{max-width:840px;margin:0 auto}
a{color:var(--primary)}
button{font-family:inherit;cursor:pointer}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:16px;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:14px}

.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.15s}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:none;padding-bottom:56px}
.panel.active{display:block}
.searchbar{display:flex;gap:8px;margin-bottom:14px}
.searchbar input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:14.5px}
.searchbar input:focus-visible{outline:2px solid var(--accent)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.section-title{font-size:20px;font-weight:700;margin:26px 0 10px}
.section-title:first-child{margin-top:0}
.lead{color:var(--ink-soft);font-size:14px;margin-bottom:16px}
.role-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.role-card .k{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:2px 7px;margin-bottom:8px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface-2);font-size:12.5px;color:var(--ink-soft);font-weight:700}
tr:last-child td{border-bottom:none}
.numlist{display:grid;gap:8px;padding:0;margin:0;list-style:none;counter-reset:n}

.numlist li::before{counter-increment:n;content:counter(n);flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.plainlist{display:grid;gap:7px;padding:0;margin:0;list-style:none}
.plainlist li{position:relative;padding-left:16px;font-size:14px;color:var(--ink)}
.plainlist li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.callout{background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 35%, var(--border));border-radius:var(--radius);padding:14px 16px;font-size:14px;margin:14px 0}
.callout b{color:var(--accent)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;background:var(--primary-soft);color:var(--primary);border-radius:var(--radius);padding:16px;margin:14px 0}

.dialog{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:10px 0;background:var(--surface)}

.dialog .txt{flex:1;font-size:14px}
.dialog .jp{margin-bottom:2px}
.dialog .kr{color:var(--ink-soft);font-size:13px}

.term.starred{border-color:color-mix(in srgb, var(--star) 40%, var(--border))}
.term-jp{flex:1;min-width:0}

.btn{border-radius:11px;padding:11px 18px;font-size:14px;font-weight:700;border:1px solid var(--border);background:var(--surface)}

/* speech: bundled pre-recorded audio (works on every device, no OS voice needed) */
let AUDIO_MAP=null;
let audioLoadFailed=false;
fetch('audio.json').then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
  .then(m=>{ AUDIO_MAP=m; })
  .catch(()=>{ audioLoadFailed=true; });
const audioCache={};
function showToast(msg){
  let t=$('#mbToast');
  if(!t){
    t=document.createElement('div'); t.id='mbToast';
    t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;max-width:88vw;text-align:center;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._hideTimer);
  t._hideTimer=setTimeout(()=>{ t.style.opacity='0'; },2600);
}
function playAudio(id){
  if(!id) return;
  if(audioLoadFailed){ showToast('음성 데이터를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.'); return; }
  if(!AUDIO_MAP){ showToast('음성 데이터를 불러오는 중입니다. 잠시 후 다시 눌러 주세요.'); return; }
  const b64=AUDIO_MAP[id];
  if(!b64){ showToast('이 항목의 음성이 없습니다.'); return; }
  try{
    let a=audioCache[id];
    if(!a){ a=new Audio('data:audio/mpeg;base64,'+b64); audioCache[id]=a; }
    a.pause(); a.currentTime=0;
    const p=a.play();
    if(p && p.catch) p.catch(()=>showToast('음성 재생에 실패했습니다. 다시 눌러 주세요.'));
  }catch(e){ showToast('음성 재생 중 오류가 발생했습니다.'); }
}
const speakerSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const copySvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

function copyText(str,btn){
  const done=()=>{ btn.classList.add('copied'); btn.querySelector('.lbl').textContent='복사됨'; setTimeout(()=>{btn.classList.remove('copied'); btn.querySelector('.lbl').textContent='복사';},1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(done).catch(()=>fallbackCopy(str,done));
  } else fallbackCopy(str,done);
}
function fallbackCopy(str,done){
  try{
    const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){}
}

let quizMode='terms';
let quizPool=[]; let quizIdx=0; let quizRevealed=false;
let quizStat={know:0,unsure:0};
function shuffle(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function newQuizPool(){ quizPool = shuffle(quizMode==='terms'?TERMS:SENTENCES); quizIdx=0; quizRevealed=false; quizStat={know:0,unsure:0}; }
function renderQuiz(){
  if(quizPool.length===0) newQuizPool();
  return `

    <div class="quiz-actions" id="quizActions"></div>
  </div>`;
}
function paintQuiz(){
  const wrap=$('#panel-quiz'); if(!wrap) return;
  const card=$('#flipCard'); const stat=$('#quizActions');
  if(!card) return;
  if(quizIdx>=quizPool.length){
    card.innerHTML=`<div class="flip-cat">퀴즈 완료</div><div class="flip-kr">전체 ${quizPool.length}문제를 모두 풀었습니다.</div>`;
    stat.innerHTML=`<button class="btn primary" id="qRestart" type="button">다시 섞어서 풀기</button>`;
    $('#qRestart').onclick=()=>{ newQuizPool(); paintQuiz(); };
  } else {
    const item=quizPool[quizIdx];
    if(quizMode==='terms'){
      card.innerHTML=`<div class="flip-cat">${esc(item.cat)}</div><div class="flip-jp">${esc(item.jp)}</div>${quizRevealed?`<div class="flip-yomi">${esc(item.yomi)}</div><div class="flip-kr">${esc(item.kr)}</div>`:''}`;
    } else {
      card.innerHTML=`<div class="flip-cat">${esc(item.cat)}</div><div class="flip-jp" style="font-size:18px">${esc(item.jp)}</div>${quizRevealed?`<div class="flip-kr">${esc(item.kr)}</div>`:''}`;
    }
    if(!quizRevealed){
      stat.innerHTML=`<button class="btn primary" id="qReveal" type="button">정답 보기</button>`;
      $('#qReveal').onclick=()=>{ quizRevealed=true; paintQuiz(); };
    } else {
      stat.innerHTML=`<button class="btn good" id="qKnowBtn" type="button">알고 있었어요</button><button class="btn bad" id="qUnsureBtn" type="button">헷갈렸어요</button>`;
      $('#qKnowBtn').onclick=()=>{ quizStat.know++; quizIdx++; quizRevealed=false; paintQuiz(); };
      $('#qUnsureBtn').onclick=()=>{ quizStat.unsure++; quizIdx++; quizRevealed=false; paintQuiz(); };
    }
  }
  $('#qKnow').textContent=quizStat.know;
  $('#qUnsure').textContent=quizStat.unsure;
  $('#qLeft').textContent=Math.max(quizPool.length-quizIdx,0);
  $$('[data-qmode]',wrap).forEach(b=>b.setAttribute('aria-pressed', b.dataset.qmode===quizMode?'true':'false'));
}

/* ============ MOUNT ============ */
function paintPanel(id){
  if(id==='terms') paintTerms();
  else if(id==='sent') paintSent();
  else if(id==='check') refreshCheckPanel();
  else if(id==='quiz') paintQuiz();
}
function refreshCheckPanel(){
  const root=$('#panel-check');
  if(!root) return;
  root.innerHTML = renderCheck();
  bindCheck(root);
}

function mount(){
  const panels=$('#panels');
  panels.innerHTML = TABS.map(t=>`<section class="panel" id="panel-${t.id}" role="tabpanel"></section>`).join('');
  $('#panel-home').innerHTML = renderHome();
  $('#panel-flow').innerHTML = renderFlow();
  $('#panel-terms').innerHTML = renderTerms();
  $('#panel-sent').innerHTML = renderSent();
  $('#panel-dept').innerHTML = renderDept();
  $('#panel-confuse').innerHTML = renderConfuse();
  $('#panel-check').innerHTML = renderCheck();
  $('#panel-quiz').innerHTML = renderQuiz();

  paintTerms(); paintSent(); bindCheck($('#panel-check')); paintQuiz();

  document.body.addEventListener('click',(e)=>{
    const sb=e.target.closest('[data-audio-id]');
    if(sb){ playAudio(sb.dataset.audioId); return; }
    const cb=e.target.closest('[data-copy]');
    if(cb){ copyText(cb.dataset.copy, cb); return; }
    const catChip=e.target.closest('#termChips .chip');
    if(catChip){ termCatFilter=catChip.dataset.cat; $$('#termChips .chip').forEach(c=>c.setAttribute('aria-pressed', c===catChip?'true':'false')); paintTerms(); return; }
    const qmode=e.target.closest('[data-qmode]');
    if(qmode){ quizMode=qmode.dataset.qmode; newQuizPool(); paintQuiz(); return; }
  });
  document.body.addEventListener('input',(e)=>{
    if(e.target.id==='termSearch'){ termQuery=e.target.value; paintTerms(); }
    if(e.target.id==='sentSearch'){ sentQuery=e.target.value; paintSent(); }
  });
}

/* theme toggle (manual override, remembered per-viewer only) */
function initTheme(){
  const saved=lsGet('mb_theme',null);
  if(saved==='dark'||saved==='light') document.documentElement.setAttribute('data-theme',saved);
  updateThemeLabel();
  $('#themeToggle').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : (cur==='light' ? null : (matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
    if(next) document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
    lsSet('mb_theme', next);
    updateThemeLabel();
  });
}
function updateThemeLabel(){
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeToggle').textContent = isDark ? '라이트모드' : '다크모드';
}

initTabs();
mount();
initTheme();
</script>
